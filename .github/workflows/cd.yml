name: CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create dummy build environment
        run: echo "SECRET_SANTA_DB_DATA_PATH=/" > .env

      - name: Build image
        run: docker compose --profile app build

      - name: Push image to ghcr.io
        run: docker compose --profile app push
